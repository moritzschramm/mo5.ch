	<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js" integrity="sha512-bcfltY+lNLlNxz38yBBm/HLaUB1gTV6I0e+fahbF9pS6roIdzUytozWdnFV8ZnM6cSAG5EbmO0ag0a/fLZSG4Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
	<style>
		body {
			overflow: hidden;
			margin: 0;
			padding: 0;
			background-color: #000000;
		}
	</style>
</head>
<body>
	<main></main>

	<script>
var prev, next;
var r1 = 200, r2 = 100;
var g1 = 200, g2 = 100;
var b1 = 200, b2 = 100;
var iStart = 0, iEnd = 200;
var jStep = 60;
var radStep = 3;
var amp = 100;

function setup() {
	createCanvas(windowWidth, windowHeight, WEBGL);
	angleMode(DEGREES);
        prev = createFramebuffer({ format: FLOAT });
        next = createFramebuffer({ format: FLOAT });
        imageMode(CENTER);
        background(30);
}

function draw() {

        [prev, next] = [next, prev];

        next.begin();
        clear();

        push();
        image(prev, 0, 0);
        pop();

        background('rgba(0,0,0,0.02)');

	rotateX(frameCount / 20);
	noFill();
	stroke(255);

	for (var i = iStart; i < iEnd; i++) {

		var r = map(sin(frameCount), -1, 1, r1, r2);
		var g = map(i, iStart, iEnd, g1, g2);
		var b = map(cos(frameCount / 2), -1, 1, b1, b2);
		var alpha = map(i, iStart, iEnd, 255, 0);

		stroke(r, g, b, alpha);

		rotate(frameCount / 150);

		beginShape();
		for (var j = 0; j < 360; j += jStep) {

			var rad = i * radStep;
			var x = rad * cos(j);
			var y = rad * sin(j);
			var z = sin(frameCount + i * radStep) * amp;

			vertex(x, y, z);
		}
		endShape(CLOSE);
	}
        next.end();
        image(next, 0, 0);
}
	</script>
</body>
